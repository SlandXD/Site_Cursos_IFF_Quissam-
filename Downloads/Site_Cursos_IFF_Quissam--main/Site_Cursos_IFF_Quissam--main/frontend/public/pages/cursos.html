<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trilhas — Construct Academy</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
<div class="app-layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="/" class="sidebar-logo"><span class="logo-icon">◈</span>Construct<strong>Academy</strong></a>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">Menu</div>
      <a href="dashboard.html" class="sidebar-link">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Início
      </a>
      <a href="cursos.html" class="sidebar-link active">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="currentColor" stroke-width="1.8"/></svg>
        Trilhas
      </a>
      <a href="certificados.html" class="sidebar-link">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M9 21l3-3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Certificados
      </a>
      <div class="sidebar-section" style="margin-top:12px">Conta</div>
      <a href="perfil.html" class="sidebar-link">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Perfil
      </a>
      <a href="#" class="sidebar-link" id="logoutBtn">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Sair
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="sidebarAvatar">?</div>
        <div>
          <div class="user-name" id="sidebarName">—</div>
          <div class="user-level" id="sidebarLevel">Nível 1</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="top-bar">
      <button onclick="document.getElementById('sidebar').classList.toggle('open')" style="background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:4px">
        <span style="display:block;width:22px;height:2px;background:var(--text);border-radius:2px"></span>
        <span style="display:block;width:22px;height:2px;background:var(--text);border-radius:2px"></span>
        <span style="display:block;width:22px;height:2px;background:var(--text);border-radius:2px"></span>
      </button>
      <span class="top-bar-title">Trilhas de Aprendizado</span>
    </header>

    <div class="page-content">
      <!-- Detalhe de curso (quando id na URL) -->
      <div id="courseDetail" style="display:none"></div>

      <!-- Lista de cursos -->
      <div id="coursesList">
        <div style="margin-bottom:28px">
          <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:6px">Todas as trilhas</h1>
          <p style="color:var(--text2);font-size:.9rem">Escolha por onde começar. Siga a ordem recomendada para melhores resultados.</p>
        </div>
        <div id="coursesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px"></div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
<script>
  requireAuth();

  document.getElementById('logoutBtn').addEventListener('click', e => {
    e.preventDefault();
    localStorage.removeItem('ca_token');
    localStorage.removeItem('ca_user');
    window.location.href = '/pages/login.html';
  });

  async function loadSidebar() {
    try {
      const d = await API.get('/student/dashboard');
      document.getElementById('sidebarAvatar').textContent = d.user.name.charAt(0).toUpperCase();
      document.getElementById('sidebarName').textContent   = d.user.name;
      document.getElementById('sidebarLevel').textContent  = `Nível ${d.user.level} — ${d.user.xp} XP`;
    } catch {}
  }

  async function loadCourseDetail(courseId) {
    const dl = document.getElementById('courseDetail');
    const ll = document.getElementById('coursesList');
    try {
      const data = await API.get(`/courses/${courseId}`);
      ll.style.display = 'none';
      dl.style.display = 'block';

      const enrolled = data.enrolled;
      const progress = data.progress || 0;

      dl.innerHTML = `
        <div style="margin-bottom:20px">
          <a href="cursos.html" style="font-size:.85rem;color:var(--text3)">← Voltar para trilhas</a>
        </div>
        <div style="display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start" class="course-detail-grid">
          <div>
            <div style="font-size:.75rem;color:var(--accent2);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">${data.level}</div>
            <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:12px">${data.name}</h1>
            <p style="color:var(--text2);line-height:1.7;margin-bottom:28px">${data.description}</p>
            <h2 style="font-size:1rem;font-weight:700;margin-bottom:16px">Conteúdo da trilha</h2>
            <div class="modules-list" id="lessonsList"></div>
          </div>
          <div style="background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:24px;position:sticky;top:80px">
            <div style="text-align:center;margin-bottom:20px">
              <div id="courseProgressRing" class="progress-ring" style="justify-content:center;margin-bottom:12px"></div>
              <div style="font-size:.85rem;color:var(--text2)">${Math.round(progress)}% concluído</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;font-size:.83rem;color:var(--text2);margin-bottom:20px">
              <div>📚 ${data.lessons.length} aulas</div>
              <div>⏱ ${data.duration || '—'}</div>
              <div>📊 ${data.level}</div>
            </div>
            ${enrolled
              ? `<button onclick="window.location.href='player.html?course=${data.id}&lesson=${data.nextLesson}'" class="btn-form">Continuar trilha</button>`
              : `<button id="enrollBtn" class="btn-form">Matricular-se grátis</button>`
            }
          </div>
        </div>
      `;

      buildProgressRing(document.getElementById('courseProgressRing'), progress, 72, 6);

      // Carrega aulas com status de progresso
      const lessonsList = document.getElementById('lessonsList');
      lessonsList.innerHTML = data.lessons.map((l, i) => {
        let statusClass = 'lock', icon = '🔒', badgeClass = 'badge-locked', badgeText = 'Bloqueado';
        if (l.status === 'completed') { statusClass = 'done'; icon = '✓'; badgeClass = 'badge-done';    badgeText = 'Concluído'; }
        if (l.status === 'current')   { statusClass = 'curr'; icon = '▶'; badgeClass = 'badge-current'; badgeText = 'Disponível'; }
        const clickable = l.status !== 'locked';
        return `
          <div class="module-item ${l.status === 'locked' ? 'locked' : ''} ${l.status === 'completed' ? 'completed' : ''}"
               ${clickable ? `onclick="window.location.href='player.html?course=${data.id}&lesson=${l.id}'"` : ''}>
            <div class="module-status ${statusClass}">${icon}</div>
            <div class="module-info">
              <h4>${i + 1}. ${l.title}</h4>
              <span>${l.type === 'video' ? '🎬 Vídeo' : '📝 Atividade'} • ${l.duration || '—'}</span>
            </div>
            <span class="module-badge ${badgeClass}">${badgeText}</span>
          </div>
        `;
      }).join('');

      if (!enrolled) {
        document.getElementById('enrollBtn').addEventListener('click', async () => {
          try {
            await API.post(`/courses/${data.id}/enroll`);
            showToast('Matriculado com sucesso!', 'success');
            loadCourseDetail(courseId);
          } catch (err) {
            showToast(err.message, 'error');
          }
        });
      }
    } catch (err) {
      showToast('Erro ao carregar curso', 'error');
    }
  }

  async function loadCourses() {
    try {
      const data = await API.get('/courses');
      const grid = document.getElementById('coursesGrid');
      grid.innerHTML = data.courses.map(c => `
        <div class="trilha-card ${c.featured ? 'featured' : ''}" style="cursor:pointer" onclick="window.location.href='cursos.html?id=${c.id}'">
          ${c.featured ? '<div class="trilha-badge-feat">Mais popular</div>' : ''}
          <div class="trilha-icon">${c.emoji || '🎮'}</div>
          <div class="trilha-level">${c.level}</div>
          <h3>${c.name}</h3>
          <p>${c.shortDesc}</p>
          <div class="trilha-meta">
            <span>${c.totalLessons} aulas</span><span>·</span><span>${c.duration}</span>
          </div>
          ${c.myProgress !== undefined ? `
            <div style="margin-bottom:12px">
              <div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--text3);margin-bottom:4px">
                <span>Progresso</span><span>${Math.round(c.myProgress)}%</span>
              </div>
              <div style="height:4px;background:var(--border);border-radius:99px;overflow:hidden">
                <div style="height:100%;width:${c.myProgress}%;background:var(--accent);border-radius:99px"></div>
              </div>
            </div>
          ` : ''}
          <div class="btn-trilha">${c.myProgress !== undefined ? 'Continuar' : 'Ver trilha'}</div>
        </div>
      `).join('');
    } catch (err) {
      showToast('Erro ao carregar trilhas', 'error');
    }
  }

  const params = new URLSearchParams(window.location.search);
  const courseId = params.get('id');

  loadSidebar();
  if (courseId) {
    loadCourseDetail(courseId);
  } else {
    loadCourses();
  }
</script>
</body>
</html>
